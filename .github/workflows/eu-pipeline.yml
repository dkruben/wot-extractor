name: EU source pipeline
on:
  workflow_dispatch:
    inputs:
      target:
        description: Publication branch
        type: choice
        options: [candidate/EU, EU]
        default: candidate/EU
      publish:
        description: Publish after validation
        type: boolean
        default: false
      warm_test:
        description: Verify cached replay produces identical files
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  eu:
    uses: dkruben/wot-extractor/.github/workflows/eu-build.yml@main
    with:
      target: ${{ inputs.target || 'candidate/EU' }}
      publish: ${{ inputs.publish || false }}
      warm_test: ${{ inputs.warm_test }}
