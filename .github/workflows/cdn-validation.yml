name: Real CDN validation

on:
  push:
    branches: [automation/cdn-validation]
    paths:
      - .github/workflows/cdn-validation.yml
      - scripts/validate_cdn_output.py
      - scripts/check_python27_syntax.py
      - scripts/cdn_fetch.mjs
      - scripts/cdn_matrix.py
      - src/wot_extractor/cdn_regions.py
      - src/wot_extractor/data/wg_realms.json
  workflow_dispatch:
    inputs:
      regions:
        description: ALL or comma-separated EU,CT,NA,ASIA,CN (RU/LESTA excluded)
        default: ALL
        required: true
  workflow_call:
    inputs:
      regions:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cdn-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.regions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
      - id: regions
        env:
          REGIONS: ${{ inputs.regions || 'NA,ASIA,CN' }}
        run: python3 scripts/cdn_matrix.py --regions "$REGIONS"
  scripts:
    needs: targets
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
      # External research engine; pinned and executed, not vendored into our tool.
      - uses: actions/checkout@v4
        with:
          repository: unicum-gg/wot.build
          ref: 1832f2ff545a2950867fa698296c92315752bf81
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9.16'
      - name: Install extraction and Python decompilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full xdelta3 rdiff
          python -m pip install 'uncompyle6==3.8.0' 'xdis==6.0.5' polib
          cd engine
          npm ci --no-audit --no-fund
      - name: Fetch and decompile the real scripts package
        working-directory: engine
        env:
          WOTSRC_PYTHON: python
          REALM: ${{ matrix.realm }}
          WGUS_HOST: ${{ matrix.host }}
          WGUS_GUID: ${{ matrix.guid }}
          NODE_OPTIONS: --import=${{ github.workspace }}/project/scripts/cdn_fetch.mjs
          WG_CDN_FETCH_AUTO: '1'
          WG_CDN_METRICS_PATH: ${{ github.workspace }}/evidence/cdn-transfer.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          npm run sources -- --host "$WGUS_HOST" --guid "$WGUS_GUID" --only scripts --out ../output 2>&1 | tee ../evidence/generator.log
      - name: Validate generated files and record hashes
        env:
          REALM: ${{ matrix.realm }}
        run: python project/scripts/validate_cdn_output.py output evidence --realm "$REALM"
      - name: Check Python 2.7 syntax without executing game code
        run: |
          docker run --rm -v "$PWD:/work" -w /work python:2.7.18-slim \
            python project/scripts/check_python27_syntax.py output evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdn-validation-${{ matrix.realm }}
          path: |
            output/
            evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
