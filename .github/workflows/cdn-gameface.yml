name: Real CDN Gameface validation

on:
  push:
    branches: [automation/cdn-gameface]
    paths:
      - .github/workflows/cdn-gameface.yml
      - scripts/cdn_gameface.ts
      - scripts/cdn_fetch.mjs
      - src/wot_extractor/cdn_gameface.py
      - src/wot_extractor/gameface/**
      - scripts/cdn_matrix.py
      - src/wot_extractor/cdn_regions.py
      - src/wot_extractor/data/wg_realms.json
  workflow_dispatch:
    inputs:
      regions:
        description: ALL or comma-separated EU,CT,NA,ASIA,CN (RU/LESTA excluded)
        default: ALL
        required: true
  workflow_call:
    inputs:
      regions:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: cdn-gameface-${{ github.ref }}
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.regions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
      - id: regions
        env:
          REGIONS: ${{ inputs.regions || 'NA,ASIA,CN' }}
        run: python3 scripts/cdn_matrix.py --regions "$REGIONS"
  gameface:
    needs: targets
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      PYTHONPATH: ${{ github.workspace }}/project/src
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
      - uses: actions/checkout@v4
        with:
          repository: unicum-gg/wot.build
          ref: 1832f2ff545a2950867fa698296c92315752bf81
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full xdelta3 rdiff
          cd engine
          npm ci --no-audit --no-fund
          cp ../project/scripts/cdn_gameface.ts ./cdn_gameface.ts
          cp ../project/scripts/cdn_fetch.mjs ./cdn_fetch.mjs
      - name: Reconstruct GUI packages and import real Gameface resources
        working-directory: engine
        env:
          REALM: ${{ matrix.realm }}
          WGUS_HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          npx tsx cdn_gameface.ts --realm "$REALM" --host "$WGUS_HOST" --regions-file ../project/src/wot_extractor/data/wg_realms.json --out "../output/wot_src_${REALM}" --evidence ../evidence 2>&1 | tee ../evidence/acquisition.log
      - name: Generate and validate sources_gameface with our processor
        env:
          REALM: ${{ matrix.realm }}
        run: |
          set -euo pipefail
          python -u -m wot_extractor.cdn_gameface process "output/wot_src_${REALM}" evidence --realm "$REALM" --jobs 2 2>&1 | tee evidence/processing.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdn-gameface-${{ matrix.realm }}
          path: |
            output/
            evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
