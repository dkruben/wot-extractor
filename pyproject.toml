[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wot-extractor"
version = "0.1.0"
description = "World of Tanks Source Extractor & Decompiler (Driftkings)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["wgus>=0.0.12"]

[project.scripts]
wot-extractor = "wot_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
