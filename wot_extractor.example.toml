# wot-extractor configuration.
# Copy to "wot_extractor.toml" (in the project root) and adjust.
# Every field is optional.

[paths]
# Folder where the wot_src_<REALM> trees are created. Relative to this file.
output_root = "."

[detect]
# Bounded disk search when the other sources fail.
scan_drives = true
# Maximum search depth (from the drive root).
scan_depth = 2

[decompile]
# Python 2.7 with uncompyle6 (decompiles and validates the 2.7 bytecode). Empty = automatic
# detection (WOT_EXTRACTOR_PY27 variable, "py -2.7" launcher, C:..H:\Python27).
python27 = ""
# Python 3 with uncompyle6 for the fallback decompiler. Empty = the current interpreter.
python3 = ""
# Timeout per file, in seconds.
timeout = 120

[actionscript]
# FFDec (JPEXS Free Flash Decompiler): ffdec-cli.jar, ffdec.jar or its folder. Empty = automatic
# detection (WOT_EXTRACTOR_FFDEC variable, "Program Files (x86)\FFDec", "Program Files\FFDec").
ffdec = ""
# Java for FFDec. Empty = JAVA_HOME or the "java" on the PATH.
java = ""
# Maximum memory of each JVM (one process per SWF in parallel).
java_heap = "4g"
# RABCDAsm (folder with abcexport.exe and rabcdasm.exe): lossless .asasm disassembly of the SWFs whose
# code FFDec cannot rebuild. Empty = WOT_EXTRACTOR_RABCDASM variable or the PATH. (XVM ships a copy in
# xvm-master/src_build/bin/windows_i686/rabcdasm.)
rabcdasm = ""
# Timeout per SWF, in seconds (lobby.swf takes ~25 min).
timeout = 3600

[gameface]
# node.exe, used only to check the syntax of the formatted JavaScript (node --check; nothing is executed).
# Empty = the "node" on the PATH; without node the check is token by token only.
node = ""

[realms.EU]
# Empty = automatic detection.
install = ""
preferred_drive = "D:"

[realms.CT]
install = ""
preferred_drive = "C:"
